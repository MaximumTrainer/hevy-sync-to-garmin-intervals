name: sync

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC every day, after the day's training
  workflow_dispatch:
    inputs:
      days:
        description: "Sync Hevy workouts from the last N days"
        default: "2"
      dry_run:
        description: "Only log what would change"
        type: boolean
        default: false
      all_history:
        description: "Backfill: every Hevy workout ever recorded (ignores days)"
        type: boolean
        default: false
      since:
        description: "Backfill: every Hevy workout from this date on, YYYY-MM-DD (ignores days)"
        default: ""
      target:
        description: "Which service to update"
        type: choice
        options: [both, garmin, intervals]
        default: both
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  sync:
    needs: test
    timeout-minutes: 120   # a backfill over years of workouts takes a while
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      # Garmin refreshes its tokens as they are used. The latest ones are kept
      # in the Actions cache; GARMIN_TOKENS seeds the first run, and seeds
      # again whenever the secret is changed.
      - name: Restore Garmin tokens
        uses: actions/cache/restore@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-v2-${{ github.run_id }}
          restore-keys: garmin-tokens-v2-
      - name: Seed Garmin tokens from the secret
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS || secrets.GARMIN_TOKEN }}
        run: |
          [ -n "$GARMIN_TOKENS" ] || exit 0
          seed=$(printf '%s' "$GARMIN_TOKENS" | sha256sum | cut -c1-64)
          if [ "$(cat ~/.garminconnect/seed.sha256 2>/dev/null)" != "$seed" ]; then
            echo "Seeding Garmin tokens from the secret"
            mkdir -p -m 700 ~/.garminconnect
            printf '%s' "$GARMIN_TOKENS" > ~/.garminconnect/garmin_tokens.json
            chmod 600 ~/.garminconnect/garmin_tokens.json
            echo "$seed" > ~/.garminconnect/seed.sha256
          fi

      - name: Sync
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY || secrets.HEVY_KEY }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          LOOKBACK_DAYS: ${{ inputs.days || '2' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          BACKFILL_ALL: ${{ inputs.all_history && 'true' || '' }}
          BACKFILL_SINCE: ${{ inputs.since }}
          # The daily run has no inputs: set the repository variable SYNC_TARGET
          # to garmin or intervals to change what it updates.
          SYNC_TARGET: ${{ inputs.target || vars.SYNC_TARGET || 'both' }}
        run: python probe.py

      - name: Save Garmin tokens
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-v2-${{ github.run_id }}
